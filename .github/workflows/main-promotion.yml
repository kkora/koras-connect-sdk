name: Main promotion policy
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  statuses: write
jobs:
  main-promotion-source:
    name: Validate develop promotion
    runs-on: ubuntu-latest
    steps:
      # No checkout, execution of PR code, or interpolation of PR text.
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const sameRepository = pr.head.repo?.full_name === context.repo.owner + '/' + context.repo.repo;
            const allowed = sameRepository && pr.head.ref === 'develop' && pr.base.ref === 'main';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: pr.head.sha,
              context: 'main-source/develop',
              state: allowed ? 'success' : 'failure',
              description: allowed ? 'Promotion from develop in this repository' : 'Main accepts only develop from this repository',
              target_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/pull/' + pr.number
            });
            if (!allowed) core.setFailed('Open development PRs against develop. Only develop can promote to main.');
