name: SDK release candidate
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish reviewed packages to NuGet (requires release tag and owner approval record)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Koras.Connect.slnx
      - run: dotnet build Koras.Connect.slnx -c Release --no-restore
      - run: dotnet test Koras.Connect.slnx -c Release --no-build
      - run: dotnet pack Koras.Connect.slnx -c Release --no-build -o artifacts
      - run: python eng/validate_packages.py
      - run: python eng/generate_sbom.py
      - run: python eng/generate_tooling_inventory.py
      - run: python eng/release_checks.py
      - run: python eng/check_sources.py
      - run: python -m unittest discover -s tests/release -v
      - run: python eng/check_vulnerabilities.py
      - run: dotnet restore samples/PackageConsumer/PackageConsumer.csproj --configfile samples/PackageConsumer/NuGet.Config
      - run: dotnet run --project samples/PackageConsumer/PackageConsumer.csproj --configuration Release --no-restore
      - run: dotnet restore samples/PackageConsumer.NextGen/PackageConsumer.NextGen.csproj --configfile samples/PackageConsumer.NextGen/NuGet.Config
      - run: dotnet run --project samples/PackageConsumer.NextGen/PackageConsumer.NextGen.csproj --configuration Release --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: artifacts/
  publish:
    if: ${{ inputs.publish }}
    needs: validate
    runs-on: ubuntu-latest
    environment: nuget-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: artifacts
      - run: python eng/release_checks.py --publish --ref "${{ github.ref }}"
      - name: Publish approved packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY"
          VERSION=$(python3 -c "import json; print(json.load(open('eng/release_manifest.json'))['version'])")
          # Publish in the manifest's dependency-validated order (see eng/release_checks.py), not filesystem glob
          # order, so a consumer never tries to restore a package before one of its own dependencies is live.
          # --skip-duplicate makes a retry after a partial failure idempotent: packages already published on a
          # prior attempt are skipped instead of failing the whole run.
          python3 -c "import json; print('\n'.join(json.load(open('eng/release_manifest.json'))['packages']))" | while read -r name; do
            dotnet nuget push "artifacts/$name.$VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
