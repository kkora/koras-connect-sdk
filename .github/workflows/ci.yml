name: SDK CI
on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "chore/**"]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Koras.Connect.slnx
      - run: dotnet build Koras.Connect.slnx --no-restore --configuration Release
      - run: dotnet test Koras.Connect.slnx --no-build --configuration Release --logger trx
      - run: dotnet list Koras.Connect.slnx package --vulnerable --include-transitive --no-restore
      - run: dotnet pack Koras.Connect.slnx --no-build --configuration Release --output artifacts
      - run: python eng/validate_packages.py
      - run: python eng/check_sources.py
      - run: python eng/generate_sbom.py
      - run: python eng/release_checks.py
      - run: python -m unittest discover -s tests/release -v
      - run: dotnet restore samples/PackageConsumer/PackageConsumer.csproj --configfile samples/PackageConsumer/NuGet.Config
      - run: dotnet run --project samples/PackageConsumer/PackageConsumer.csproj --configuration Release --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
