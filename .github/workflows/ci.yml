name: SDK CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore tests/Koras.Connect.Tests/Koras.Connect.Tests.csproj
      - run: dotnet build tests/Koras.Connect.Tests/Koras.Connect.Tests.csproj --no-restore --configuration Release
      - run: dotnet test tests/Koras.Connect.Tests/Koras.Connect.Tests.csproj --no-build --configuration Release
